name: Build & Release MajorStay Windows Desktop App (.exe)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da Versão (ex: v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron Build Tools
        run: npm install --no-save electron@33.2.1 electron-builder@25.1.8 electron-updater@6.3.9

      - name: Build Windows .exe Installer & Portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            npx electron-builder --win --config electron-builder.json --publish always
          } else {
            npx electron-builder --win --config electron-builder.json
          }

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MajorStay-Windows-Executables
          path: dist-electron/*.exe
